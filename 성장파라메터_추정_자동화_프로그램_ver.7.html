<!DOCTYPE html>

<style>
/* 레이아웃: 상단 고정 탭 + 공통 필터 막대, 탭마다 조절부 → 그림(2열) → 결과표 순서의 작업대 */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#17202c; --muted:#5a6575; --line:#d8dde5;
  --accent:#1d4fb8; --accent-ink:#ffffff; --accent-soft:#e7edf9;
  --plotbg:#ffffff; --grid:#edf0f4; --axis:#8a94a2;
  --c1:#1f5fd1; --c2:#dd7417; --c3:#24935a; --c4:#c2377a; --c5:#7d5a2c; --c6:#6a4fcf;
  --cf:#F2A000; --cm:#0B3C6E;
  --ok:#23804f; --bad:#b8352a; --ok-bg:#e5f3eb; --bad-bg:#f9e7e5; --warn-bg:#fdf3dc;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
  --mono:"D2Coding","Consolas","SF Mono","Menlo",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --ink:#e4e9f0; --muted:#98a4b4; --line:#283241;
  --accent:#7fa3ff; --accent-ink:#0a1122; --accent-soft:#1b2843;
  --plotbg:#121923; --grid:#1f2935; --axis:#5f6b7b;
  --c1:#6f9cff; --c2:#f4a259; --c3:#5ac98a; --c4:#ef80b3; --c5:#cba679; --c6:#a892ff;
  --cf:#F5B031; --cm:#7FA8E0;
  --ok:#6fd39c; --bad:#ff8a7e; --ok-bg:#16301f; --bad-bg:#3a1a17; --warn-bg:#352a10;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --ink:#e4e9f0; --muted:#98a4b4; --line:#283241;
  --accent:#7fa3ff; --accent-ink:#0a1122; --accent-soft:#1b2843;
  --plotbg:#121923; --grid:#1f2935; --axis:#5f6b7b;
  --c1:#6f9cff; --c2:#f4a259; --c3:#5ac98a; --c4:#ef80b3; --c5:#cba679; --c6:#a892ff;
  --cf:#F5B031; --cm:#7FA8E0;
  --ok:#6fd39c; --bad:#ff8a7e; --ok-bg:#16301f; --bad-bg:#3a1a17; --warn-bg:#352a10;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px 0;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;flex:1 1 auto;min-width:0}
.brand h1{font-size:18px;margin:0;letter-spacing:-.01em;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.brand svg{flex:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.tabs{display:flex;gap:2px;overflow-x:auto;flex-basis:100%;margin-top:8px;scrollbar-width:thin}
.tab{border:0;background:none;font:inherit;font-size:13.5px;color:var(--muted);padding:9px 13px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.filterbar{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding-block:10px;font-size:12.5px;color:var(--muted)}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fgroup > span.lbl{font-weight:600;letter-spacing:.02em}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.count{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
main{padding-block:6px 56px}
.panel{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:16px;margin:0;text-wrap:balance}
.sec-h p{margin:0;color:var(--muted);font-size:12.5px}
.sub-h{font-size:14.5px;margin:10px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.f.inline{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type="number"]{width:7.5em;font-family:var(--mono)}
input[type="number"].narrow{width:5em}
input[type="checkbox"]{accent-color:var(--accent);width:15px;height:15px}
textarea{width:100%;min-height:170px;font-family:var(--mono);font-size:12.5px;line-height:1.45;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:16px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 12px 8px;min-width:0}

.fig-h h3{font-size:13.5px;margin:0}
.fig-h .tools{display:flex;gap:6px}
svg.plot{width:100%;height:auto;display:block;max-width:880px;margin-inline:auto}
.tbl{min-width:0}

.tbl-h h3{font-size:13.5px;margin:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.tot td{border-top:2px solid var(--line);font-weight:600}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--bg)}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}

.note{color:var(--muted);font-size:12.5px;margin:0}

.banner{background:var(--warn-bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px}
.banner.plain{background:var(--surface)}

.pill.sig{background:var(--bad-bg);color:var(--bad)}
.pill.ns{background:var(--ok-bg);color:var(--ok)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:160px;flex:1 1 200px}
.progress > i{display:block;height:100%;width:0;background:var(--accent)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px 14px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:13.5px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0}
.src{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.src b{word-break:break-all}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:13px}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details summary{cursor:pointer;font-weight:600;font-size:13px}
details[open] summary{margin-bottom:10px}
.refs{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}
.formula{font-family:var(--mono);font-size:12.5px;background:var(--bg);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true"><g fill="none" stroke="var(--accent)" stroke-width="1.4"><ellipse cx="15" cy="14" rx="14" ry="12"/><ellipse cx="13.5" cy="14" rx="10" ry="8.4" opacity=".75"/><ellipse cx="12.3" cy="14" rx="6.4" ry="5.2" opacity=".55"/><ellipse cx="11.4" cy="14" rx="3" ry="2.4" opacity=".4"/></g></svg>
      <div><h1>성장파라메터 추정 자동화 프로그램</h1><p>von Bertalanffy 성장식 · 오프라인 단일 파일 · ver.7</p></div>
    </div>

<script>
/*ENGINE-START*/
const E = (() => {
  // ---------- 난수 ----------
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function randn(rng){ let u=0; while(u===0) u=rng(); const v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

  // ---------- 기초 통계 ----------
  const sum=a=>{let s=0;for(const v of a)s+=v;return s;};
  const mean=a=>a.length?sum(a)/a.length:NaN;
  function sd(a){ if(a.length<2) return NaN; const m=mean(a); let s=0; for(const v of a) s+=(v-m)*(v-m); return Math.sqrt(s/(a.length-1)); }
  function quantile(sorted,p){ if(!sorted.length) return NaN; const h=(sorted.length-1)*p, lo=Math.floor(h), hi=Math.ceil(h); return sorted[lo]+(sorted[hi]-sorted[lo])*(h-lo); }
  function median(a){ return quantile([...a].sort((x,y)=>x-y),0.5); }

  // ---------- 특수함수 (카이제곱, t, F 분포) ----------
  function gammaln(x){ const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
    let y=x, tmp=x+5.5; tmp-=(x+0.5)*Math.log(tmp); let ser=1.000000000190015; for(let j=0;j<6;j++) ser+=c[j]/++y; return -tmp+Math.log(2.5066282746310005*ser/x); }
  function gser(a,x){ let ap=a, s=1/a, d=s; for(let n=0;n<1000;n++){ ap++; d*=x/ap; s+=d; if(Math.abs(d)<Math.abs(s)*1e-16) break; } return s*Math.exp(-x+a*Math.log(x)-gammaln(a)); }
  function gcf(a,x){ let b=x+1-a, c=1e300, d=1/b, h=d; for(let i=1;i<1000;i++){ const an=-i*(i-a); b+=2; d=an*d+b; if(Math.abs(d)<1e-300) d=1e-300; c=b+an/c; if(Math.abs(c)<1e-300) c=1e-300; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<1e-16) break; } return Math.exp(-x+a*Math.log(x)-gammaln(a))*h; }
  function gammq(a,x){ if(x<=0) return 1; return x<a+1 ? 1-gser(a,x) : gcf(a,x); }
  const chi2sf=(x,df)=> x<=0?1:gammq(df/2,x/2);
  function betacf(a,b,x){ const qab=a+b, qap=a+1, qam=a-1; let c=1, d=1-qab*x/qap; if(Math.abs(d)<1e-300) d=1e-300; d=1/d; let h=d;
    for(let m=1;m<=1000;m++){ const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<1e-300)d=1e-300; c=1+aa/c; if(Math.abs(c)<1e-300)c=1e-300; d=1/d; h*=d*c;
      aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<1e-300)d=1e-300; c=1+aa/c; if(Math.abs(c)<1e-300)c=1e-300; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<1e-15) break; } return h; }
  function betai(a,b,x){ if(x<=0) return 0; if(x>=1) return 1; const bt=Math.exp(gammaln(a+b)-gammaln(a)-gammaln(b)+a*Math.log(x)+b*Math.log(1-x));
    return x<(a+1)/(a+b+2) ? bt*betacf(a,b,x)/a : 1-bt*betacf(b,a,1-x)/b; }
  const tp2=(t,df)=> betai(df/2,0.5,df/(df+t*t));           // 양측 p
  function tinv2(p,df){ let lo=0,hi=1e4; for(let i=0;i<200;i++){ const m=(lo+hi)/2; if(tp2(m,df)>p) lo=m; else hi=m; } return (lo+hi)/2; }
  const fsf=(F,d1,d2)=> F<=0?1:betai(d2/2,d1/2,d2/(d2+d1*F));

  // ---------- 선형대수 ----------
  function solve(A,b){ const n=b.length; const M=A.map((r,i)=>[...r,b[i]]);
    for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
      if(!(Math.abs(M[p][c])>1e-300)) return null; [M[c],M[p]]=[M[p],M[c]];
      for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]/M[c][c]; if(f!==0) for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; } }
    const x=M.map((r,i)=>r[n]/r[i]); return x.every(Number.isFinite)?x:null; }
  function inv(A){ const n=A.length, cols=[]; for(let j=0;j<n;j++){ const e=new Array(n).fill(0); e[j]=1; const x=solve(A,e); if(!x) return null; cols.push(x); } return A.map((_,i)=>cols.map(c=>c[i])); }
  const ss=r=>{let s=0;for(let i=0;i<r.length;i++) s+=r[i]*r[i]; return s;};
  function olsSSE(X,y){ const p=X[0].length, A=Array.from({length:p},()=>new Array(p).fill(0)), g=new Array(p).fill(0);
    X.forEach((row,i)=>{ for(let a=0;a<p;a++){ g[a]+=row[a]*y[i]; for(let b=0;b<p;b++) A[a][b]+=row[a]*row[b]; } });
    const beta=solve(A,g); if(!beta) return NaN; let s=0; X.forEach((row,i)=>{ let f=0; for(let a=0;a<p;a++) f+=row[a]*beta[a]; s+=(y[i]-f)**2; }); return s; }

  // ---------- Levenberg–Marquardt ----------
  function lm(fn,p0,maxIter=400){
    let p=p0.slice(); let cur=fn(p,true); if(!cur) return null;
    const np=p.length, m=cur.r.length; let rss=ss(cur.r), lam=1e-3, it=0, conv=false;
    const normal=(J,r)=>{ const A=Array.from({length:np},()=>new Array(np).fill(0)), g=new Array(np).fill(0);
      for(let i=0;i<m;i++){ const o=i*np; for(let a=0;a<np;a++){ const ja=J[o+a]; if(ja===0) continue; g[a]+=ja*r[i]; for(let b=a;b<np;b++) A[a][b]+=ja*J[o+b]; } }
      for(let a=0;a<np;a++) for(let b=0;b<a;b++) A[a][b]=A[b][a]; return {A,g}; };
    for(;it<maxIter;it++){
      const {A,g}=normal(cur.J,cur.r); let accepted=false;
      while(lam<1e16){
        const Ad=A.map((row,i)=>row.map((v,j)=>i===j? v+lam*Math.max(v,1e-9):v));
        const d=solve(Ad,g.map(v=>-v));
        if(d){ const pn=p.map((v,i)=>v+d[i]); const nx=fn(pn,true);
          if(nx){ const rn=ss(nx.r);
            if(rn<rss){ const dr=(rss-rn)/(rss+1e-300); const step=Math.max(...d.map((v,i)=>Math.abs(v)/(Math.abs(p[i])+1e-8)));
              p=pn; cur=nx; rss=rn; lam=Math.max(lam/10,1e-12); accepted=true; if(dr<1e-13 || step<1e-10) conv=true; break; } } }
        lam*=10; }
      if(!accepted){ conv=true; break; } if(conv) break;
    }
    const {A}=normal(cur.J,cur.r); let cov=null;
    if(m>np){ const iA=inv(A); if(iA){ const s2=rss/(m-np); cov=iA.map(r=>r.map(v=>v*s2)); } }
    return {p,rss,cov,conv,iter:it,m,np};
  }

  // ---------- von Bertalanffy ----------
  // L(t) = L∞ · (1 − exp(−K (t − t0)))
  const NAMES=['Linf','k','t0'];
  const pv=(e,p)=> typeof e==='number'? p[e] : e.v;
  function fitVB(t,L,g,G,o){
    let np=0; const p0=[], shIdx={};
    for(const nm of NAMES){ if(nm==='t0'&&o.fixT0!=null) continue; if(o.share&&o.share[nm]){ shIdx[nm]=np++; const j=NAMES.indexOf(nm); p0.push(mean(o.starts.map(s=>s[j]))); } }
    const idx=[];

function classLabel(a,w,dec){ return (Number.isInteger(w)&&Math.abs(a-Math.round(a))<1e-9&&w>=1)? `${Math.round(a)}–${Math.round(a+w-1)}` : `${fmt(a,dec)}–<${fmt(a+w,dec)}`; }
function renderLF(){
  const p=$('#p-lf'); const recs=cur().filter(r=>Number.isFinite(r.len));
  if(S.map.len<0||!recs.length){ p.innerHTML=head('체장빈도')+empty('체장 열을 지정하면 체장빈도 분포가 표시됩니다.'); return; }
  const Ls=recs.map(r=>r.len); const mn=arrMin(Ls), mx=arrMax(Ls);
  const auto=niceStep(Math.max(mx-mn,1e-6),22); const w=S.lfWidth&&+S.lfWidth>0? +S.lfWidth : auto;
  const start=Math.floor(mn/w+1e-9)*w; const nb=Math.max(1,Math.floor((mx-start)/w+1e-9)+1);
  const G=groupsOf(recs), N=recs.length;
  const counts=G.map(g=>{ const c=new Array(nb).fill(0); for(const r of g.recs){ const i=Math.min(nb-1,Math.floor((r.len-start)/w+1e-9)); c[i]++; } return c; });
  const val=c=> S.lfMode==='pct'? 100*c/N : c;
  const bars=[]; let ymax=0;
  for(let i=0;i<nb;i++){ let acc=0; G.forEach((g,gi)=>{ const v=val(counts[gi][i]); if(v>0) bars.push({x0:start+i*w,x1:start+(i+1)*w,y0:acc,y1:acc+v,color:g.color}); acc+=v; }); ymax=Math.max(ymax,acc); }
  const dec=Math.max(0,-Math.floor(Math.log10(w)+1e-9));
  const svg=plot({xd:[start,start+nb*w],yd:niceDomain(0,ymax*1.05||1,6,true),layers:[{type:'bars',bars}],xlab:LL(),ylab:S.lfMode==='pct'?'비율 (%)':'Individual of Fish',
    legend:S.group!=='none'?G.map(g=>({label:`${FL(g.key)} (n=${g.recs.length})`,color:g.color})):null,aria:'체장빈도 분포 막대그래프'});
  const statRow=(k,rs,c)=>{ const v=rs.map(r=>r.len); let mi=0; if(c) c.forEach((x,i)=>{ if(x>c[mi]) mi=i; });
    return [k,String(v.length),fmt(E.mean(v),2),fmt(E.sd(v),2),fmt(arrMin(v),1),fmt(arrMax(v),1),c?`${fmt(start+mi*w,dec)}–${fmt(start+(mi+1)*w,dec)}`:'–']; };
  const totC=new Array(nb).fill(0); counts.forEach(c=>c.forEach((x,i)=>totC[i]+=x));
  const rows=G.map((g,gi)=>statRow(g.key,g.recs,counts[gi])); if(G.length>1) rows.push(statRow('합계',recs,totC));
  const freqHead=['계급 하한','계급 상한',...G.map(g=>g.key),...(G.length>1?['합계']:[])];

  const w=+S.srW>0?+S.srW:10; const mn=arrMin(recs.map(r=>r.len)), mx=arrMax(recs.map(r=>r.len)); const st=Math.floor(mn/w+1e-9)*w, nb=Math.floor((mx-st)/w+1e-9)+1;

const fixVal=()=> S.fixT0? S.t0v : null;

function vbData(recs){ const lo=ageLo(), hi=ageHi(); const rs=recs.filter(r=>Number.isFinite(r.age)&&Number.isFinite(r.len)&&r.age>=lo-1e-9&&r.age<=hi+1e-9); return {rs,t:rs.map(r=>r.age),L:rs.map(r=>r.len)}; }

function ageRangeAll(G){ let a=Infinity,b=-Infinity; for(const g of G) for(const v of (g.tAll||g.t)){ if(v<a)a=v; if(v>b)b=v; } return [a,b]; }

// 성장곡선 그림의 Y축: 관측 체장 범위 + 여유 8%, 직접 지정 값이 있으면 우선

function yRange(vals){ let lo=Infinity,hi=-Infinity; vals.forEach(x=>{ if(x<lo)lo=x; if(x>hi)hi=x; }); if(!Number.isFinite(lo)){ lo=0; hi=1; }

  if(S.yMin!==''||S.yMax!==''){ // 직접 지정한 경우 최솟값에서 시작하는 눈금
    const span=b-a, mag=Math.pow(10,Math.floor(Math.log10(span))); let best=null;
    const score=st=>Math.abs(span/st-5)+(Math.abs(a/st-Math.round(a/st))<1e-9?0:2);
    for(const m of [0.1,0.2,0.25,0.5,1,2,2.5,5]){ const st=m*mag; const k=span/st; if(k>=3.99&&k<=8.01&&(!best||score(st)<score(best))) best=st; }
    if(best){ const t=[]; for(let v=a; v<=b+best*1e-9; v+=best) t.push(+v.toPrecision(12)); r.ticks=t; } }
  return r; }

function vbStats(g){ const f=g.fit.groups[0]; const n=g.t.length, k=g.fit.np; const sig=Math.sqrt(g.fit.rss/(n-k));

function bootKey(){ return vbKey()+'|'+S.bootMethod; }
const BOOTLAB={case:'Case bootstrap',resid:'Residual bootstrap'};
async function runBoot(){
  if(S.bootRunning) return; const G=vbFits().filter(g=>g.fit); if(!G.length) return;
  const B=Math.max(50,Math.min(20000,Math.round(+S.bootB||1000))), seed=Math.round(+S.bootSeed||1); S.bootB=B;
  S.bootRunning=true; S.bootStop=false; renderBoot();
  const key0=bootKey(); // 실행 시작 시점의 자료·설정 키
  const rng=E.mulberry32(seed), total=B*G.length; let done=0; const out=[]; const fx=fixVal();
  const method=S.bootMethod;
  for(const g of G){ const est=g.fit.groups[0], n=g.t.length; const reps=[]; let fail=0;
    // 잔차 재표집: 연령은 고정, 예측값 + 중심화한 잔차를 복원추출 (nlstools::nlsBoot 방식)
    const fitted=g.t.map(t=>E.vbL(est,t)); const res0=g.L.map((v,i)=>v-fitted[i]); const rm=E.mean(res0); const res=res0.map(v=>v-rm);
    for(let b=0;b<B;b++){ if(S.bootStop) break; if(bootKey()!==key0){ S.bootStop=true; break; }
      const tb=new Array(n), Lb=new Array(n);
      if(method==='resid'){ for(let i=0;i<n;i++){ tb[i]=g.t[i]; Lb[i]=fitted[i]+res[Math.floor(rng()*n)]; } }
      else { for(let i=0;i<n;i++){ const j=Math.floor(rng()*n); tb[i]=g.t[j]; Lb[i]=g.L[j]; } }
      let f=null; if(new Set(tb).size>=3){ f=E.fitOne(tb,Lb,fx,[est.Linf,est.k,est.t0]); if(!f||!f.conv) f=E.fitBest(tb,Lb,fx); }
      if(f){ const q=f.groups[0]; reps.push([q.Linf,q.k,q.t0]); } else fail++;
      done++; if(done%20===0){ const bar=$('#bootBar'); if(bar) bar.style.width=(100*done/total).toFixed(1)+'%'; const lab=$('#bootLab'); if(lab) lab.textContent=`${done} / ${total}`; await sleep(); } }
    out.push({key:g.key,color:g.color,all:g.all,est,reps,fail,n,t:g.t,L:g.L,tAll:g.tAll,LAll:g.LAll}); if(S.bootStop) break; }
  S.bootRunning=false;
  if(!S.bootStop){ S.boot={key:key0,B,seed,method,res:out}; }
  else if(bootKey()!==key0){ S.boot=null; toast('실행 중 자료·필터·설정이 바뀌어 부트스트랩을 중지했습니다. 다시 실행하세요'); }
  else toast('부트스트랩을 중지했습니다');
  renderBoot(); }
function bootBandFig(list,xd,title,file){ const layers=[]; let lmax=0;
  list.forEach(r=>{ const grid=[]; const s=Math.max(xd[0],r.est.t0); for(let i=0;i<=60;i++) grid.push(s+(xd[1]-s)*i/60);
    const up=[],lo=[]; for(const t of grid){ const v=r.reps.map(x=>x[0]*(1-Math.exp(-x[1]*(t-x[2])))).sort((a,b)=>a-b); up.push([t,E.quantile(v,0.975)]); lo.push([t,E.quantile(v,0.025)]); }
    up.forEach(q=>{ if(q[1]>lmax) lmax=q[1]; }); (r.LAll||r.L).forEach(v=>{ if(v>lmax) lmax=v; });
    if(!r.all||list.length===1) layers.push({type:'points',data:(r.tAll||r.t).map((t,i)=>[t,(r.LAll||r.L)[i]]),color:r.color,r:2.3,opacity:list.length===1?0.4:0.22});
    layers.push({type:'band',upper:up,lower:lo,color:r.color,opacity:0.2});
    layers.push({type:'line',data:grid.map(t=>[t,E.vbL(r.est,t)]),color:r.color,width:2.2}); });
  const leg=list.length>1?list.map(r=>({label:FL(r.key),color:r.color,kind:'line'})):[{label:'추정 곡선',color:list[0].color,kind:'line'},{label:'95% 신뢰대',color:list[0].color,opacity:0.3}];
  return figure(title,plot({xd,yd:yRange(lenVals(list)),layers,xlab:'연령 (년)',ylab:LL(),legend:leg,aria:'부트스트랩 95% 신뢰대를 포함한 성장곡선'}),file); }

  const rows=[]; const pnames=[['L∞',0,2],['K',1,3],['t₀',2,3]];

    cols.forEach((c,ci2)=>{ if(S.fixT0&&c.nm==='t₀') return; const s=[...c.v].sort((x,y)=>x-y);

  let kmax=0,kmin=Infinity,Lmin=Infinity,Lmx=0; R.forEach(r=>r.reps.forEach(x=>{ kmax=Math.max(kmax,x[1]); kmin=Math.min(kmin,x[1]); Lmin=Math.min(Lmin,x[0]); Lmx=Math.max(Lmx,x[0]); }));

  const Gs=groupsOf(gRecs(cur())).map(g=>{ const a=vbDataAll(g.recs); return {...g,...vbData(g.recs),tAll:a.t,LAll:a.L}; }).filter(g=>g.t.length);
  if(Gs.length<2){ p.innerHTML=title+exampleBanner()+empty('비교하려면 그룹이 2개 이상 필요합니다. 위쪽 필터에서 그룹을 2개 이상 켜 두세요.'); return; }
  if(!C){ const t=[],L=[],g=[]; Gs.forEach((G,gi)=>{ G.t.forEach((v,i)=>{ t.push(v); L.push(G.L[i]); g.push(gi); }); });
    C=E.kimura(t,L,g,Gs.length); cache.lrt={key,res:C}; }
  if(C.error!=null){ p.innerHTML=title+exampleBanner()+empty(`'${esc(Gs[C.error].key)}' 그룹은 성장식을 추정할 수 없습니다 (4개체 이상, 연령 3개 이상 필요). 필터에서 제외하고 다시 보세요.`); return; }
  const lab={Linf:'H₁: L∞ 동일',k:'H₂: K 동일',t0:'H₃: t₀ 동일',all:'H₄: 성장곡선 동일 (L∞, K, t₀ 모두)'};
  const rows=[[{html:'H<sub>Ω</sub>: 그룹별 개별 곡선',text:'HΩ: 그룹별 개별 곡선',cls:'t'},String(3*Gs.length),fmt(C.rssO,3),'–','–','–','']];
  C.hyps.forEach(h=>{ if(h.error){ rows.push([lab[h.key],'','추정 실패','','','','']); return; }
    const sig=h.p<0.05; rows.push([lab[h.key],String(h.fit.np),fmt(h.rss,3),fmt(h.chi,3),String(h.df),fmtP(h.p),{html:`<span class="pill ${sig?'sig':'ns'}">${sig?'차이 있음':'차이 없음'}</span>`,text:sig?'차이 있음':'차이 없음'}]); });
  const prow=(name,fit)=>fit.groups.map((q,gi)=>[gi===0?name:'',Gs[gi].key,fmt(q.Linf,2),fmt(q.k,4),fmt(q.t0,3)]);
  let prows=C.sep.map((f,gi)=>[gi===0?'HΩ (개별)':'',Gs[gi].key,fmt(f.groups[0].Linf,2),fmt(f.groups[0].k,4),fmt(f.groups[0].t0,3)]);
  C.hyps.forEach(h=>{ if(!h.error) prows=prows.concat(prow(lab[h.key].split(':')[0],h.fit)); });
  const [a0]=ageRangeAll(Gs); const xd=niceDomain(Math.min(0,a0-0.5),curveEnd(Gs)+0.3); const layers=[]; let lmax=0;
  Gs.forEach((g,gi)=>{ const f=C.sep[gi].groups[0]; g.LAll.forEach(v=>{ if(v>lmax) lmax=v; }); lmax=Math.max(lmax,f.Linf);
    layers.push({type:'points',data:g.tAll.map((t,i)=>[t,g.LAll[i]]),color:g.color,r:2.4,opacity:0.3});
    layers.push({type:'line',data:curvePts(f,xd[0],xd[1]),color:g.color,width:2.4}); });
  const h4=C.hyps.find(h=>h.key==='all'); if(h4&&!h4.error) layers.push({type:'line',data:curvePts(h4.fit.groups[0],xd[0],xd[1]),color:'var(--ink)',width:1.6,dash:'6 4'});
  const svg=plot({xd,yd:yRange(lenVals(Gs)),layers,xlab:'연령 (년)',ylab:LL(),legend:[...Gs.map(g=>({label:`${FL(g.key)} (n=${g.t.length})`,color:g.color,kind:'line'})),{label:'공통 곡선 (H₄)',color:'var(--ink)',kind:'line',dash:'6 4'}],aria:'그룹별 성장곡선 비교'});
  const sigs=C.hyps.filter(h=>!h.error&&h.p<0.05).map(h=>lab[h.key].split(':')[0]);
  const summary= h4&&!h4.error ? (h4.p<0.05? `<b>${esc(Gs.map(g=>g.key).join(', '))}</b> 사이의 성장곡선은 통계적으로 다릅니다 (H₄: χ² = ${fmt(h4.chi,2)}, df = ${h4.df}, ${pTxt(h4.p)}). 기각된 가설: ${sigs.join(', ')}.` : `<b>${esc(Gs.map(g=>g.key).join(', '))}</b> 사이 성장곡선의 차이는 유의하지 않습니다 (H₄: χ² = ${fmt(h4.chi,2)}, df = ${h4.df}, ${pTxt(h4.p)}). 공통 곡선 하나로 나타낼 수 있습니다.`) : '';
  p.innerHTML=`${title}${exampleBanner()}
  <div class="banner plain">${summary}</div>
  ${figure('그룹별 성장곡선',svg,'우도비검정_성장곡선')}
  ${table('가설 검정',['가설','매개변수 수','RSS','χ²','df','p','판정 (α = 0.05)'],rows,'우도비검정',
    `N = ${C.N}, 그룹 ${Gs.length}개 (${Gs.map(g=>esc(g.key)).join(', ')}). χ² = −N·ln(RSS<sub>Ω</sub>/RSS<sub>ω</sub>), df = 공통으로 묶은 매개변수 수 × (그룹 수 − 1). ${growthNote()}. 이 검정은 t₀ 고정 설정과 무관하게 세 매개변수를 모두 추정합니다. 비교할 그룹은 위쪽 필터로 고릅니다.`)}
  ${table('모형별 매개변수 추정값',['모형','그룹',`L∞ (${S.unit})`,'K (/년)','t₀ (년)'],prows,'우도비검정_매개변수')}`; }

// ===================================================================
// 탭·이벤트
// ===================================================================
const RENDER={data:renderData,lf:renderLF,lw:renderLW,prec:renderPrec,edge:renderEdge,vb:renderVB,boot:renderBoot,gr:renderGR,lrt:renderLRT};
function render(){ renderFilter(); for(const k in RENDER){ const el=$('#p-'+k); el.hidden=k!==S.tab; if(k!==S.tab) el.innerHTML=''; } for(const k in TBL) delete TBL[k];
  try{ RENDER[S.tab](); }catch(e){ console.error(e); $('#p-'+S.tab).innerHTML=empty('계산 중 오류가 났습니다: '+esc(e.message)); } }
function setTab(t){ S.tab=t; $$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t))); render(); window.scrollTo({top:0}); }
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(b) setTab(b.dataset.tab); });

document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.fsex!=null){ const v=t.dataset.fsex; S.fSex.has(v)?S.fSex.delete(v):S.fSex.add(v); bump(); render(); return; }
  if(t.dataset.farea!=null){ const v=t.dataset.farea; S.fArea.has(v)?S.fArea.delete(v):S.fArea.add(v); bump(); render(); return; }
  if(t.id==='openBtn'){ $('#fileIn').click(); return; }
  if(t.id==='exBtn'){ S.wb=null; S.source=''; S.sheetName=''; loadText(makeExample(),true); render(); return; }
  if(t.id==='bootRun'){ runBoot(); return; }
  if(t.id==='bootStopBtn'){ S.bootStop=true; return; }
  if(t.dataset.copy){ const T=TBL[t.dataset.copy]; const txt=[T.head,...T.rows].map(r=>r.map(plain).join('\t')).join('\n');
    try{ await navigator.clipboard.writeText(txt); toast('표를 복사했습니다. 엑셀에 붙여넣으세요'); }catch(err){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('표를 복사했습니다');}catch(e2){} ta.remove(); } return; }
  if(t.dataset.csv){ const T=TBL[t.dataset.csv]; const q=v=>{ v=String(plain(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    download(new Blob(['﻿'+[T.head,...T.rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),T.file+'.csv'); return; }
  if(t.dataset.svgdl){ const svg=t.closest('.fig').querySelector('svg.plot'); download(new Blob([svgSource(svg)],{type:'image/svg+xml'}),t.dataset.svgdl+'.svg'); return; }
  if(t.dataset.png){ const svg=t.closest('.fig').querySelector('svg.plot'); const vb=svg.viewBox.baseVal; const sc=3;
    const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=vb.width*sc; c.height=vb.height*sc; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); c.toBlob(b=>download(b,t.dataset.png+'.png'),'image/png'); };
    img.onerror=()=>toast('PNG 변환에 실패했습니다. SVG로 저장해 주세요'); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgSource(svg)); return; }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='groupSel'){ S.group=t.value; bump(); render(); return; }
  if(t.id==='inclAll'){ S.inclAll=t.checked; render(); return; }
  if(t.dataset.map){ S.map[t.dataset.map]=+t.value; if(t.dataset.map==='len'&&+t.value>=0) setLenNames(S.headers[+t.value]); buildRecords(); render(); return; }
  if(t.dataset.rslot!=null){ const rs=(S.map.rs||[-1,-1,-1]).slice(); rs[+t.dataset.rslot]=+t.value; S.map.rs=rs; S.map.reads= rs[0]>=0&&rs[1]>=0&&rs[0]!==rs[1] ? rs.filter((v,k)=>v>=0&&rs.indexOf(v)===k) : []; buildRecords(); render(); return; }
  if(t.id==='unitSel'){ S.unit=t.value; render(); return; }
  if(t.id==='lenName'){ S.lenName=t.value.trim()||'L'; render(); return; }
  if(t.id==='lenAxis'){ S.lenAxis=t.value.trim(); render(); return; }
  if(t.id==='wtName'){ S.wtName=t.value.trim()||'W'; render(); return; }
  if(t.id==='wtAxis'){ S.wtAxis=t.value.trim(); render(); return; }
  if(t.id==='fracOn'){ S.fracOn=t.checked; deriveAges(); render(); return; }
  if(t.id==='birthM'){ S.birthM=+t.value; deriveAges(); render(); return; }
  if(t.id==='birthD'){ const v=Math.round(+t.value); if(v>=1&&v<=31){ S.birthD=v; deriveAges(); } render(); return; }
  if(t.id==='fracMode'){ S.fracMode=t.value; deriveAges(); render(); return; }
  if(t.id==='fileIn'&&t.files[0]){ const f=t.files[0]; t.value=''; await openFile(f); return; }
  if(t.id==='sheetSel'){ try{ await loadSheet(+t.value); }catch(err){ S.loadError=err.message; } render(); return; }
  if(t.id==='lfW'){ S.lfWidth=t.value; render(); return; }
  if(t.id==='lfMode'){ S.lfMode=t.value; render(); return; }
  if(t.id==='srW'){ S.srW=t.value; render(); return; }
  if(t.id==='lwLog'){ S.lwLog=t.checked; render(); return; }
  if(t.id==='lwBase'){ S.lwBase=t.value; render(); return; }
  if(t.id==='exclDisc'){ S.exclDisc=t.checked; render(); return; }
  if(t.id==='fixT0'){ S.fixT0=t.checked; render(); return; }
  if(t.id==='t0v'){ const v=+t.value; if(Number.isFinite(v)){ S.t0v=v; render(); } return; }
  if(t.id==='showMean'){ S.showMean=t.checked; render(); return; }
  if(t.id==='ageMin'){ S.ageMin=t.value.trim(); render(); return; }
  if(t.id==='ageMax'){ S.ageMax=t.value.trim(); render(); return; }
  if(t.id==='paperStyle'){ S.paperStyle=t.checked; render(); return; }
  if(t.id==='curveMax'){ S.curveMax=t.value.trim(); render(); return; }
  if(t.id==='yMin'){ S.yMin=t.value.trim(); render(); return; }
  if(t.id==='yMax'){ S.yMax=t.value.trim(); render(); return; }
  if(t.id==='edgeSplit'){ S.edgeSplit=t.value; render(); return; }
  if(t.id==='edgePlus'){ S.edgePlus=t.value.trim(); render(); return; }
  if(t.id==='t5max'){ S.t5max=t.value; render(); return; }
  if(t.id==='grMax'){ S.grMax=t.value; render(); return; }
  if(t.id==='bootB'){ S.bootB=+t.value||1000; return; }
  if(t.id==='bootSeed'){ S.bootSeed=+t.value||1; return; }
  if(t.id==='bootMethod'){ S.bootMethod=t.value; render(); return; }
  if(t.id==='bootPanels'){ S.bootPanels=t.checked; render(); return; }
});

// 끌어다 놓기 (화면 어디에 놓아도 열림)
let dragDepth=0;
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
document.addEventListener('dragenter',e=>{ if(hasFiles(e)){ e.preventDefault(); dragDepth++; const d=$('#dropzone'); if(d) d.classList.add('over'); } });
document.addEventListener('dragover',e=>{ if(hasFiles(e)) e.preventDefault(); });
document.addEventListener('dragleave',()=>{ dragDepth=Math.max(0,dragDepth-1); if(!dragDepth){ const d=$('#dropzone'); if(d) d.classList.remove('over'); } });
document.addEventListener('drop',async e=>{ const f=e.dataTransfer&&e.dataTransfer.files[0]; if(!f) return; e.preventDefault(); dragDepth=0; const d=$('#dropzone'); if(d) d.classList.remove('over'); await openFile(f); });

// 테마
const THEMES=['system','light','dark'], TLAB={system:'시스템',light:'밝게',dark:'어둡게'};
function applyTheme(m){ if(m==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',m); $('#themeBtn').textContent='테마: '+TLAB[m]; try{localStorage.setItem('otolith-theme',m);}catch(e){} }
let themeMode='system'; try{ themeMode=localStorage.getItem('otolith-theme')||'system'; }catch(e){}
applyTheme(themeMode);
$('#themeBtn').addEventListener('click',()=>{ themeMode=THEMES[(THEMES.indexOf(themeMode)+1)%3]; applyTheme(themeMode); });

// 시작
loadText(makeExample(),true); render();
</script>
</body>
</html>
